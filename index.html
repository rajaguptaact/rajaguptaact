<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <title>Raja Gupta Act | Professional Colour Pencil Studio</title>
  <meta name="google-site-verification" content="dN1MbPiHaOubD3Qf6umJDnE0mQOXjQUr4g7Cc2xNolw" />
  <!-- Tailwind, React, Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/feather-icons"></script>

  <!-- FIREBASE CLOUD DATABASE -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>


  <style>
    /* 🚨 ANTI-THEFT & ANTI-PRINT SECURITY 🚨 */
    @media print {
      body { display: none !important; }
    }
    img { 
      -webkit-touch-callout: none; 
      -webkit-user-select: none; 
      -khtml-user-select: none; 
      -moz-user-select: none; 
      -ms-user-select: none; 
      user-select: none;
      -webkit-user-drag: none; 
      pointer-events: none; 
    }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .glass-panel { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.5); }
    .img-protect-overlay { position: absolute; inset: 0; z-index: 20; }
    
    /* CUSTOM HEARTBEAT ANIMATION FOR BADGE */
    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }
    .animate-heartbeat {
      animation: heartbeat 1.5s infinite;
    }
    
    /* VIP TOAST ANIMATION */
    @keyframes popupToast {
      0% { transform: translate(-50%, 150%); opacity: 0; }
      10% { transform: translate(-50%, 0); opacity: 1; }
      90% { transform: translate(-50%, 0); opacity: 1; }
      100% { transform: translate(-50%, 150%); opacity: 0; }
    }
    .animate-toast {
      animation: popupToast 5s cubic-bezier(0.16, 1, 0.3, 1) forwards; /* 🚨 5 seconds ka time de diya */
    }

    /* 🚨 SINGLE ERROR HIGHLIGHTER (Sirf ek box ko laal karne ke liye) 🚨 */
    .error-glow {
        border-color: #ef4444 !important; 
        background-color: #fef2f2 !important;
        transition: all 0.3s ease;
    }

    /* 🖥️ AUTOMATIC FLUID RESPONSIVE SCALE (Tablet, Laptop, Monitor & Desktop Mode) */
    @media (min-width: 768px) {
        html {
            font-size: clamp(17px, 1.85vw, 19.5px);
        }
    }
  </style>
</head>
<body class="bg-gradient-to-br from-indigo-50 via-purple-50 to-pink-50 text-gray-900 font-sans antialiased selection:bg-purple-300">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    
    // =======================================================
    // 🚨 SECURE GOOGLE BACKEND BRIDGE URL 🚨
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzDl2K7tO_O0LdYU2KITp26UmT-AAW5_pz-fAQWoS2jvwX4YIdhms2IGKU3RwCrmlym/exec";
    // =======================================================

    // --- FIREBASE INITIALIZATION & OFFLINE PERSISTENCE ---
    const firebaseConfig = {
      apiKey: "AIzaSyBCX9rALYZSxzYvawPexwXIHTSA3uhU24E",
      authDomain: "rajaguptaact.firebaseapp.com",
      projectId: "rajaguptaact",
      storageBucket: "rajaguptaact.firebasestorage.app",
      messagingSenderId: "9946165167",
      appId: "1:9946165167:web:5809fb442b06882980495a"
    };
    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();
    try {
        db.settings({ experimentalForceLongPolling: true, useFetchStreams: false });
    } catch(e) {}

      const ArtworkCard = React.memo(({ art, getPrice, cart, addToCart, updateGalleryCartQty, openSizeGuide, openArtZoom, wishlist, userLikes, toggleWishlist, handleLikeArt, shareArtwork, setWishlistPopupArt, isHidden }) => {

      // Global memory cache taaki mockups dobara fetch na hoan
      window.rajaMockupCache = window.rajaMockupCache || {};

      const scrollRef = useRef(null);
      const [mockups, setMockups] = useState(() => {
          if (window.rajaMockupCache[art.id] && window.rajaMockupCache[art.id].length > 0) return window.rajaMockupCache[art.id];
          if (art.customMockups && art.customMockups.length > 0) return art.customMockups;
          return [];
      });
      const [loadingMockups, setLoadingMockups] = useState(() => {
          if (window.rajaMockupCache[art.id] && window.rajaMockupCache[art.id].length > 0) return false;
          if (art.customMockups && art.customMockups.length > 0) return false;
          return true;
      });
      const [mockupRetryTick, setMockupRetryTick] = useState(0);
      const [isDescOpen, setIsDescOpen] = useState(false);
      const [selectedSizeId, setSelectedSizeId] = useState('original');

      // 🏷️ LONG-PRESS & HOVER TOOLTIP LOGIC (Like / Share / Wishlist)
      const [activeTip, setActiveTip] = useState(null);
      const tipPressTimerRef = useRef(null);
      const tipHideTimerRef = useRef(null);
      const tipTriggeredRef = useRef(false);

      useEffect(() => {
          return () => {
              if (tipPressTimerRef.current) clearTimeout(tipPressTimerRef.current);
              if (tipHideTimerRef.current) clearTimeout(tipHideTimerRef.current);
          };
      }, []);

      const startTipPress = (tipKey) => {
          if (window.getSelection) { try { window.getSelection().removeAllRanges(); } catch(e) {} }
          if (tipPressTimerRef.current) clearTimeout(tipPressTimerRef.current);
          if (tipHideTimerRef.current) clearTimeout(tipHideTimerRef.current);
          tipTriggeredRef.current = false;
          tipPressTimerRef.current = setTimeout(() => {
              if (window.getSelection) { try { window.getSelection().removeAllRanges(); } catch(e) {} }
              tipTriggeredRef.current = true;
              setActiveTip(tipKey);
          }, 400);
      };

      const endTipPress = () => {
          if (tipPressTimerRef.current) clearTimeout(tipPressTimerRef.current);
          if (tipTriggeredRef.current) {
              if (tipHideTimerRef.current) clearTimeout(tipHideTimerRef.current);
              tipHideTimerRef.current = setTimeout(() => {
                  setActiveTip(null);
              }, 2000);
              setTimeout(() => {
                  tipTriggeredRef.current = false;
              }, 350);
          }
      };

      const cancelTipPress = () => {
          if (tipPressTimerRef.current) clearTimeout(tipPressTimerRef.current);
      };

      const handleTipMouseEnter = (tipKey) => {
          if (window.matchMedia && window.matchMedia('(hover: hover)').matches) {
              if (tipHideTimerRef.current) clearTimeout(tipHideTimerRef.current);
              setActiveTip(tipKey);
          }
      };

      const handleTipMouseLeave = () => {
          if (window.matchMedia && window.matchMedia('(hover: hover)').matches) {
              setActiveTip(null);
          }
      };

      const handleTipAction = (actionFn) => {
          if (tipTriggeredRef.current) {
              tipTriggeredRef.current = false;
              return;
          }
          if (tipHideTimerRef.current) clearTimeout(tipHideTimerRef.current);
          setActiveTip(null);
          actionFn();
      };

      useEffect(() => {
          let isMounted = true;
          let retryTimer = null;

          if (window.rajaMockupCache[art.id] && window.rajaMockupCache[art.id].length > 0) {
              setMockups(window.rajaMockupCache[art.id]);
              setLoadingMockups(false);
              return;
          }
          if (art.customMockups && art.customMockups.length > 0) {
              window.rajaMockupCache[art.id] = art.customMockups;
              setMockups(art.customMockups);
              setLoadingMockups(false);
              return;
          }

          const fetchMockupsSafe = async (attempt = 1) => {
              if (!isMounted) return;
              setLoadingMockups(true);
              try {
                  let snap = await db.collection('RajaMockups').where('artId', '==', art.id).get();
                  let fetched = snap.docs.map(d => d.data()).sort((a,b) => a.index - b.index).map(d => d.image).filter(Boolean);

                  // Login/Logout ya cache glitch par seedha Firebase server se dubara check karega
                  if (fetched.length === 0 && navigator.onLine) {
                      snap = await db.collection('RajaMockups').where('artId', '==', art.id).get({ source: 'server' });
                      fetched = snap.docs.map(d => d.data()).sort((a,b) => a.index - b.index).map(d => d.image).filter(Boolean);
                  }

                  if (!isMounted) return;
                  if (fetched.length > 0) {
                      window.rajaMockupCache[art.id] = fetched;
                      setMockups(fetched);
                      setLoadingMockups(false);
                      return;
                  }
                  throw new Error('Empty mockups');
              } catch (e) {
                  if (!isMounted) return;
                  if (attempt < 4) {
                      retryTimer = setTimeout(() => fetchMockupsSafe(attempt + 1), attempt * 1200);
                  } else {
                      setLoadingMockups(false);
                  }
              }
          };

          fetchMockupsSafe(1);

          const handleBackOnline = () => {
              if (isMounted && (!window.rajaMockupCache[art.id] || window.rajaMockupCache[art.id].length === 0)) {
                  fetchMockupsSafe(1);
              }
          };
          window.addEventListener('online', handleBackOnline);

          return () => {
              isMounted = false;
              if (retryTimer) clearTimeout(retryTimer);
              window.removeEventListener('online', handleBackOnline);
          };
      }, [art.id, art.customMockups, mockupRetryTick]);


      useEffect(() => {
          if (mockups.length > 0) {
              mockups.forEach(src => {
                  const img = new Image();
                  img.src = src; 
              });
          }
      }, [mockups]);

      useEffect(() => {
        const interval = setInterval(() => {
          if (scrollRef.current && window.innerWidth < 768 && mockups.length > 0) { 
            const maxScroll = scrollRef.current.scrollWidth - scrollRef.current.clientWidth;
            if (scrollRef.current.scrollLeft >= maxScroll - 50) {
              scrollRef.current.scrollTo({ left: 0, behavior: 'smooth' }); 
            } else {
              const childWidth = scrollRef.current.firstElementChild ? scrollRef.current.firstElementChild.offsetWidth + 16 : scrollRef.current.clientWidth;
              scrollRef.current.scrollBy({ left: childWidth, behavior: 'smooth' }); 
            }
          }
        }, 3500); 
        return () => clearInterval(interval);
      }, [mockups.length]);

      const hasOrigDiscount = art.priceOriginalOld && art.priceOriginal && Number(art.priceOriginalOld) > Number(art.priceOriginal);
      const origDiscountPct = hasOrigDiscount ? Math.round(((Number(art.priceOriginalOld) - Number(art.priceOriginal)) / Number(art.priceOriginalOld)) * 100) : 0;

      const sizeOptions = [
          {
              id: 'original',
              pillTitle: 'Original',
              pillSub: 'A4 Size',
              barLabel: 'Original Artwork • A4 Size',
              cartSize: 'Original A4 Colour Pencil',
              price: art.priceOriginal || art.priceOriginalOld,
              oldPrice: art.priceOriginal ? art.priceOriginalOld : null,
              isOriginal: true,
              isSold: !!art.isSold
          },
          {
              id: 'a3',
              pillTitle: 'A3',
              pillSub: 'HD Print',
              barLabel: 'HD Print • A3 Size',
              cartSize: 'Print A3',
              price: art.priceA3,
              oldPrice: null,
              isOriginal: false,
              isSold: false
          },
          {
              id: 'a4',
              pillTitle: 'A4',
              pillSub: 'HD Print',
              barLabel: 'HD Print • A4 Size',
              cartSize: 'Print A4',
              price: art.priceA4,
              oldPrice: null,
              isOriginal: false,
              isSold: false
          },
          {
              id: 'a5',
              pillTitle: 'A5',
              pillSub: 'HD Print',
              barLabel: 'HD Print • A5 Size',
              cartSize: 'Print A5',
              price: art.priceA5,
              oldPrice: null,
              isOriginal: false,
              isSold: false
          }
      ];

      const activeOpt = sizeOptions.find(o => o.id === selectedSizeId) || sizeOptions[0];
      const activeCartItem = Array.isArray(cart) ? cart.find(c => c.id === art.id && c.selectedSize === activeOpt.cartSize) : null;

      return (
        <div id={'art-' + art.id} style={{ WebkitUserSelect: 'none', userSelect: 'none', WebkitTouchCallout: 'none' }} className="glass-panel rounded-3xl shadow-xl overflow-hidden p-3.5 md:p-8 mb-6 md:mb-10 select-none">

          {/* Compact Header */}
          <div className="flex flex-wrap items-center justify-between gap-2 mb-3 pb-2.5 border-b border-gray-200/80">
            <h2 className="text-lg md:text-2xl font-black text-gray-900 leading-tight">
              {art.title}
            </h2>
            <span className="bg-gradient-to-r from-purple-100 to-pink-100 text-purple-800 text-[9px] md:text-xs font-black px-2.5 py-0.5 md:py-1 rounded-full border border-purple-200 shrink-0">
              100% COLOUR PENCIL
            </span>
          </div>

          {/* Photo Angles Slider */}
          <div className="relative">
            <p className="text-[9px] md:hidden text-gray-400 font-bold uppercase tracking-widest text-center mb-1.5 animate-pulse">
              &larr; Auto Viewing Angles &rarr;
            </p>
            <div ref={scrollRef} className="flex overflow-x-auto gap-3 md:gap-5 mb-2 pb-2 hide-scrollbar snap-x snap-mandatory scroll-smooth pt-0.5">
              {mockups.length > 0 ? (
                 mockups.map((m, i) => (
                    <div key={i} className="flex-none w-[68%] md:w-[42%] lg:w-[30%] snap-center">
                      <div
                        onClick={() => openArtZoom && openArtZoom(art)}
                        title="Tap to view HD Artwork"
                        className="w-full aspect-[4/5] rounded-2xl overflow-hidden shadow-[0_4px_15px_rgba(0,0,0,0.1)] relative flex items-center justify-center bg-gray-100 border border-gray-200 cursor-zoom-in group"
                      >
                         <img src={m} className="w-full h-full object-cover transition-transform group-hover:scale-[1.03] duration-500" onContextMenu={(e) => e.preventDefault()} />
                         <div className="img-protect-overlay"></div>
                         <span className="absolute bottom-2.5 right-2.5 z-30 pointer-events-none bg-black/55 backdrop-blur-sm text-white/95 p-1.5 rounded-full shadow border border-white/20 flex items-center justify-center">
                           <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2.5">
                             <circle cx="11" cy="11" r="7"></circle>
                             <path strokeLinecap="round" strokeLinejoin="round" d="M21 21l-4.35-4.35M11 8v6M8 11h6"></path>
                           </svg>
                         </span>
                      </div>
                    </div>
                 ))
              ) : loadingMockups ? (
                 <div className="flex flex-col justify-center items-center h-56 md:h-64 w-full rounded-2xl bg-purple-50/60 border border-purple-100 text-purple-500 font-bold gap-2">
                   <svg className="animate-spin h-6 w-6 text-purple-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle><path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                   <span className="text-xs md:text-sm animate-pulse">Loading High Quality Angles...</span>
                 </div>
              ) : (
                 <div className="flex flex-col justify-center items-center h-56 md:h-64 w-full rounded-2xl bg-gray-50 border border-dashed border-purple-200 text-center px-4 gap-3">
                   <p className="text-xs md:text-sm font-bold text-gray-500">Slow network — viewing angles couldn't load yet.</p>
                   <button
                     type="button"
                     onClick={() => { setLoadingMockups(true); setMockupRetryTick(t => t + 1); }}
                     className="bg-purple-600 hover:bg-purple-700 text-white px-4 py-2 rounded-xl font-black text-xs shadow-sm active:scale-95 transition cursor-pointer"
                   >
                     ↻ Retry Loading Angles
                   </button>
                 </div>
              )}
            </div>
          </div>

          {/* Compact 1-Line Social Bar with Long-Press & Hover Tooltips */}
          <div className="flex justify-between items-center py-2 border-b border-gray-100">
              <div className="flex items-center gap-3.5">
                  {/* LIKE BUTTON */}
                  <div className="relative flex items-center">
                      <span className={`absolute bottom-full left-0 mb-2 bg-gray-900 text-white text-[10px] md:text-xs font-black px-2.5 py-1 rounded-lg shadow-lg whitespace-nowrap pointer-events-none select-none z-30 transition-all duration-200 ${activeTip === 'like' ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-1'}`}>
                          Like
                          <span className="absolute top-full left-3 -mt-1 w-2 h-2 bg-gray-900 rotate-45"></span>
                      </span>
                      <button
                          type="button"
                          onContextMenu={(e) => e.preventDefault()}
                          onTouchStart={() => startTipPress('like')}
                          onTouchEnd={endTipPress}
                          onTouchMove={cancelTipPress}
                          onTouchCancel={cancelTipPress}
                          onMouseEnter={() => handleTipMouseEnter('like')}
                          onMouseLeave={handleTipMouseLeave}
                          onClick={() => handleTipAction(() => handleLikeArt(art))}
                          style={{ WebkitTouchCallout: 'none' }}
                          className="flex items-center gap-1.5 transform active:scale-90 transition-transform cursor-pointer select-none"
                      >
                          <svg className={`w-6 h-6 ${userLikes?.includes(art.id) ? 'text-red-500 fill-red-500' : 'text-gray-900 fill-none hover:text-gray-600'}`} stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path></svg>
                          <span className="font-black text-xs md:text-sm text-gray-900">
                            {Number(Math.max(0, Number(art.realLikes) || 0) + (Number(art.fakeLikes) || 0)).toLocaleString('en-IN')}
                          </span>
                      </button>
                  </div>

                  {/* SHARE BUTTON */}
                  <div className="relative flex items-center">
                      <span className={`absolute bottom-full left-1/2 -translate-x-1/2 mb-2 bg-gray-900 text-white text-[10px] md:text-xs font-black px-2.5 py-1 rounded-lg shadow-lg whitespace-nowrap pointer-events-none select-none z-30 transition-all duration-200 ${activeTip === 'share' ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-1'}`}>
                          Share
                          <span className="absolute top-full left-1/2 -translate-x-1/2 -mt-1 w-2 h-2 bg-gray-900 rotate-45"></span>
                      </span>
                      <button
                          type="button"
                          onContextMenu={(e) => e.preventDefault()}
                          onTouchStart={() => startTipPress('share')}
                          onTouchEnd={endTipPress}
                          onTouchMove={cancelTipPress}
                          onTouchCancel={cancelTipPress}
                          onMouseEnter={() => handleTipMouseEnter('share')}
                          onMouseLeave={handleTipMouseLeave}
                          onClick={() => handleTipAction(() => shareArtwork(art))}
                          style={{ WebkitTouchCallout: 'none' }}
                          className="transform active:scale-75 transition-transform text-gray-900 hover:text-gray-600 cursor-pointer select-none"
                      >
                          <svg className="w-5 h-5 md:w-6 md:h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"></path></svg>
                      </button>
                  </div>
              </div>

              {/* WISHLIST BUTTON */}
              <div className="relative flex items-center">
                  <span className={`absolute bottom-full right-0 mb-2 bg-gray-900 text-white text-[10px] md:text-xs font-black px-2.5 py-1 rounded-lg shadow-lg whitespace-nowrap pointer-events-none select-none z-30 transition-all duration-200 ${activeTip === 'wishlist' ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-1'}`}>
                      Wishlist
                      <span className="absolute top-full right-2.5 -mt-1 w-2 h-2 bg-gray-900 rotate-45"></span>
                  </span>
                  <button
                      type="button"
                      onContextMenu={(e) => e.preventDefault()}
                      onTouchStart={() => startTipPress('wishlist')}
                      onTouchEnd={endTipPress}
                      onTouchMove={cancelTipPress}
                      onTouchCancel={cancelTipPress}
                      onMouseEnter={() => handleTipMouseEnter('wishlist')}
                      onMouseLeave={handleTipMouseLeave}
                      onClick={() => handleTipAction(() => setWishlistPopupArt(art))}
                      style={{ WebkitTouchCallout: 'none' }}
                      className="transform active:scale-90 transition cursor-pointer select-none"
                  >
                      <svg className={`w-6 h-6 ${wishlist?.some(w => w.id === art.id) ? 'text-gray-900 fill-gray-900' : 'text-gray-900 fill-none hover:text-gray-600'}`} stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"></path></svg>
                  </button>
              </div>
          </div>


          {/* Myntra-Style SELECT SIZE + Size Guide Row */}
          <div className="mt-3 md:mt-4">
            <div className="flex items-center justify-between mb-2 md:mb-3">
              <span className="text-[11px] md:text-sm font-black uppercase tracking-wider text-gray-700">
                Select Size
              </span>
              <button
                type="button"
                onClick={() => openSizeGuide(activeOpt.id)}
                className="text-[11px] md:text-sm font-black text-pink-600 hover:text-purple-700 flex items-center gap-0.5 cursor-pointer active:scale-95 transition"
              >
                <span>Size Guide</span>
                <span className="text-sm md:text-base leading-none">›</span>
              </button>
            </div>

            {/* 4 Sleek Myntra-Style Size Pills */}
            <div className="grid grid-cols-4 gap-1.5 md:gap-3">
              {sizeOptions.map((opt) => {
                const isActive = selectedSizeId === opt.id;
                const inCartObj = Array.isArray(cart) ? cart.find(c => c.id === art.id && c.selectedSize === opt.cartSize) : null;
                return (
                  <button
                    key={opt.id}
                    type="button"
                    onClick={() => setSelectedSizeId(opt.id)}
                    className={`relative rounded-xl md:rounded-2xl py-2 px-1 md:py-3.5 md:px-3 border-2 text-center transition-all duration-200 active:scale-95 cursor-pointer ${
                      isActive
                        ? opt.isOriginal
                          ? 'border-purple-600 bg-purple-600 text-white shadow-md'
                          : 'border-pink-500 bg-pink-500 text-white shadow-md'
                        : 'border-gray-200 bg-white text-gray-800 hover:border-purple-300'
                    }`}
                  >
                    {/* Discount / Sold Mini Tag on Original Pill */}
                    {opt.isOriginal && opt.isSold && (
                      <span className="absolute -top-2 md:-top-2.5 left-1/2 -translate-x-1/2 bg-gray-600 text-white text-[7px] md:text-[10px] font-black px-1.5 md:px-2.5 py-0.5 rounded-full uppercase whitespace-nowrap shadow">
                        Sold
                      </span>

    const OrderBill = ({ ord }) => {
        const [isOpen, setIsOpen] = useState(false);
        const isCommission = ord.type === 'Commission';
        
        // Price calculator for dynamic bill
        const formatMoney = (amt) => {
            if(String(ord.displayAmount).includes('$')) return '$' + Math.ceil(Number(amt) / 83.5).toLocaleString('en-US');
            return '₹' + Number(amt).toLocaleString('en-IN');
        };
        const shippingAmt = (ord.country === 'International' || String(ord.displayAmount).includes('$')) ? 700 : 100;
        
        // Base budget calculation for Commission (Total minus Shipping)
        let baseBudgetFormatted = '';
        if (isCommission) {
             if (ord.amount) {
                 baseBudgetFormatted = formatMoney(ord.amount - shippingAmt);
             } else {
                 const totalVal = Number(String(ord.displayAmount).replace(/[^\d]/g, ''));
                 if (String(ord.displayAmount).includes('$')) {
                      baseBudgetFormatted = '$' + (totalVal - Math.ceil(700 / 83.5)).toLocaleString('en-US');
                 } else {
                      baseBudgetFormatted = '₹' + (totalVal - 100).toLocaleString('en-IN');
                 }
             }
        }
        
        return (
            <div className="w-full mt-1 md:mt-2">
                <button onClick={() => setIsOpen(!isOpen)} className="text-gray-500 text-[10px] md:text-xs font-bold underline hover:text-gray-700 cursor-pointer flex items-center justify-center w-full transition-transform active:scale-95 mt-2">
                    {isOpen ? 'Hide Details' : 'See Details'}
                </button>
                <div className={`transition-all duration-300 overflow-hidden w-full ${isOpen ? 'max-h-96 mt-3 opacity-100' : 'max-h-0 opacity-0'}`}>

        const [timeLeft, setTimeLeft] = useState(blockUntil - Date.now());
        useEffect(() => {
            const interval = setInterval(() => {
                const diff = blockUntil - Date.now();
                setTimeLeft(diff);
                if (diff <= 0) {
                    clearInterval(interval);
                    onExpire();
                }
            }, 1000);
            return () => clearInterval(interval);
        }, [blockUntil, onExpire]);

        if (timeLeft <= 0) return null;
        const m = Math.floor((timeLeft / 1000 / 60) % 60);
        const s = Math.floor((timeLeft / 1000) % 60);
        return <p className="text-2xl md:text-3xl font-black text-rose-600 font-mono tracking-widest">{String(m).padStart(2, '0')} : {String(s).padStart(2, '0')}</p>;

      const makeTinyThumb = (src) => new Promise((resolve) => {
          if (!src || typeof src !== 'string') return resolve('');
          if (src.length <= 20000) return resolve(src);
          const img = new Image();
          img.onload = () => {
              try {
                  const c = document.createElement('canvas');
                  const MAX = 120;
                  let w = img.width, h = img.height;
                  if (w > h && w > MAX) { h *= MAX / w; w = MAX; }
                  else if (h > MAX) { w *= MAX / h; h = MAX; }
                  c.width = Math.max(1, Math.round(w));
                  c.height = Math.max(1, Math.round(h));
                  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
                  resolve(c.toDataURL('image/jpeg', 0.7));
              } catch(e) { resolve(''); }
          };
          img.onerror = () => resolve('');
          img.src = src;

      const [zoomArt, setZoomArt] = useState(null);

      const zoomTimerRef = useRef(null);
      const zoomGestureRef = useRef({ mode: 'none', lastTap: 0, lastTouch: 0 });

      const clampZoomOffset = (x, y, scale) => {
          if (scale <= 1) return { x: 0, y: 0 };
          const maxX = Math.round((window.innerWidth * (scale - 1)) * 0.55);
          const maxY = Math.round((window.innerHeight * (scale - 1)) * 0.55);
          return {
              x: Math.max(-maxX, Math.min(maxX, x)),
              y: Math.max(-maxY, Math.min(maxY, y))
          };
      };

      const openArtZoom = (artObj) => {
          if (!artObj || !artObj.image) return;
          if (zoomTimerRef.current) clearTimeout(zoomTimerRef.current);
          setZoomArt(artObj);
          setZoomScale(1);
          setZoomOffset({ x: 0, y: 0 });
          setZoomArtMounted(true);
          zoomTimerRef.current = setTimeout(() => {
              setZoomArtVisible(true);
          }, 20);
      };

      const closeArtZoom = () => {
          if (zoomTimerRef.current) clearTimeout(zoomTimerRef.current);
          setZoomArtVisible(false);
          zoomTimerRef.current = setTimeout(() => {
              setZoomArtMounted(false);
              setZoomArt(null);
              setZoomScale(1);
              setZoomOffset({ x: 0, y: 0 });
          }, 260);
      };

      const setZoomLevelSafe = (nextScale) => {
          const clamped = Math.max(1, Math.min(3, Number(nextScale.toFixed(2))));
          setZoomScale(clamped);
          if (clamped <= 1) {
              setZoomOffset({ x: 0, y: 0 });
          } else {
              setZoomOffset(prev => clampZoomOffset(prev.x, prev.y, clamped));
          }
      };

      const handleZoomTouchStart = (e) => {
          zoomGestureRef.current.lastTouch = Date.now();
          if (e.touches.length === 2) {
              const dist = Math.hypot(
                  e.touches[0].clientX - e.touches[1].clientX,
                  e.touches[0].clientY - e.touches[1].clientY
              );
              zoomGestureRef.current = {
                  ...zoomGestureRef.current,
                  mode: 'pinch',
                  startDist: dist || 1,
                  startScale: zoomScale
              };
          } else if (e.touches.length === 1) {
              const now = Date.now();
              if (now - zoomGestureRef.current.lastTap < 280) {
                  zoomGestureRef.current.lastTap = 0;
                  zoomGestureRef.current.mode = 'none';
                  setZoomLevelSafe(zoomScale > 1.1 ? 1 : 2.2);
                  return;
              }
              zoomGestureRef.current.lastTap = now;
              if (zoomScale > 1) {
                  zoomGestureRef.current = {
                      ...zoomGestureRef.current,
                      mode: 'pan',
                      startX: e.touches[0].clientX,
                      startY: e.touches[0].clientY,
                      origX: zoomOffset.x,

                  };
              } else {
                  zoomGestureRef.current.mode = 'none';
              }
          }

      const calcWordDist = (a, b) => {
          if (a === b) return 0;
          const m = a.length, n = b.length;
          if (!m) return n;
          if (!n) return m;
          const dp = Array.from({ length: m + 1 }, () => new Array(n + 1).fill(0));
          for (let i = 0; i <= m; i++) dp[i][0] = i;
          for (let j = 0; j <= n; j++) dp[0][j] = j;
          for (let i = 1; i <= m; i++) {
              for (let j = 1; j <= n; j++) {
                  const cost = a[i - 1] === b[j - 1] ? 0 : 1;
                  dp[i][j] = Math.min(dp[i - 1][j] + 1, dp[i][j - 1] + 1, dp[i - 1][j - 1] + cost);

          }
          return dp[m][n];

      let cachedDevInfo = null;

      const fetchDeviceDetails = async () => {
         if (cachedDevInfo && (Date.now() - lastFetchTime < 30 * 60 * 1000)) return cachedDevInfo;

         let ip = "Unknown", location = "Unknown", org = "Unknown", deviceModel = "Unknown Device", deviceType = "Desktop PC"; 

         try {
             const ua = navigator.userAgent;
             if (/Mobile|Android|iP(hone|od)|IEMobile|BlackBerry|Kindle|Silk-Accelerated|(hpw|web)OS|Opera M(obi|ini)/.test(ua)) deviceType = "Mobile Phone";
             else if (/(tablet|ipad|playbook|silk)|(android(?!.*mobi))/i.test(ua)) deviceType = "Tablet";

             // 🚨 EXACT MODEL EXTRACTOR (Modern Browsers ke liye)
             if (navigator.userAgentData && navigator.userAgentData.getHighEntropyValues) {
                 try {
                     const uaData = await navigator.userAgentData.getHighEntropyValues(["model"]);
                     if (uaData && uaData.model) deviceModel = uaData.model;
                 } catch(e) {}
             }

             // Backup Extractor purane phones ke liye
             if (deviceModel === "Unknown Device" || deviceModel.length < 3) {
                 if (/android/i.test(ua)) {
                     const match = ua.match(/\bAndroid[^;]*;(.*?)(?:Build|\) AppleWebKit)/i);
                     if (match && match[1]) {
                         let rawModel = match[1].split(';').pop().trim();
                         rawModel = rawModel.replace(/wv|K\)|HTML|like Mac OS X/ig, "").replace(/[^a-zA-Z0-9\s-]/g, "").trim();
                         deviceModel = (rawModel.length > 2 && rawModel.length < 30) ? rawModel : "Android Smartphone";
                     } else deviceModel = "Android Smartphone";
                 } else if (/iPhone/.test(ua)) deviceModel = "Apple iPhone";
                 else if (/iPad/.test(ua)) deviceModel = "Apple iPad";
                 else if (/Windows/.test(ua)) deviceModel = "Windows PC";
                 else if (/Mac OS/.test(ua)) deviceModel = "Mac Computer";
             }
         } catch(e) {}


         // 🚨 Fast Timeout Fetch (Slow IP API par alert kabhi atke ya miss na ho)
         const fetchJsonFast = async (url, ms = 2500) => {
             const ctrl = new AbortController();
             const timer = setTimeout(() => ctrl.abort(), ms);
             try {
                 const res = await fetch(url, { signal: ctrl.signal });
                 clearTimeout(timer);
                 return await res.json();
             } catch(e) {
                 clearTimeout(timer);
                 return null;
             }
         };

         const data4 = await fetchJsonFast(`https://api.ipify.org?format=json&_t=${Date.now()}`, 2500);
         if (data4 && data4.ip && !data4.ip.includes(':')) ip = data4.ip;

         const dataGeo = await fetchJsonFast(`https://ipapi.co/${ip !== "Unknown" ? ip + '/' : ''}json/?_t=${Date.now()}`, 2500);
         if (dataGeo && dataGeo.city && !dataGeo.error) {
             if (dataGeo.ip && !dataGeo.ip.includes(':')) ip = dataGeo.ip;
             location = dataGeo.city + ", " + dataGeo.region + ", " + dataGeo.country_name;
             org = dataGeo.org || org;
         }


         if (ip.includes(':')) ip = "IPv4 Secured Network"; 
         cachedDevInfo = { ip, location, org, deviceModel, deviceType };
         lastFetchTime = Date.now();
         return cachedDevInfo;
      };

          let queue = [];
          try { queue = JSON.parse(window.localStorage.getItem('raja_tg_queue') || "[]"); } catch(e){}
          if (!Array.isArray(queue) || queue.length === 0) return;

          window.rajaTgBusy = true;
          try {
              for (let item of queue) {
                  try {
                      const ctrl = new AbortController();
                      const timer = setTimeout(() => ctrl.abort(), 12000);
                      const res = await fetch(GAS_WEB_APP_URL, {
                          method: 'POST',
                          signal: ctrl.signal,
                          body: JSON.stringify({
                              action: 'send_alert',
                              type: item.type || 'security',
                              message: item.text,
                              parse_mode: item.parse_mode || 'HTML'
                          })
                      });
                      clearTimeout(timer);
                      if (res.ok) {
                          // Sirf SUCCESS hone ke baad hi is message ko queue se hatayein
                          let latest = [];
                          try { latest = JSON.parse(window.localStorage.getItem('raja_tg_queue') || "[]"); } catch(e){}
                          window.localStorage.setItem('raja_tg_queue', JSON.stringify(latest.filter(q => q.id !== item.id)));
                      }
                  } catch(e) {
                      // Fail/Timeout hone par queue mein safe rahega, 5s mein auto-retry hoga
                  }
              }
          } finally {
              window.rajaTgBusy = false;
          }

               snap.docs.forEach(doc => {
                   if (doc.data().isRevoked !== true) {
                       sessionsMap.set(doc.id, doc.data());
                   }
               });
               const sessions = Array.from(sessionsMap.values());
               sessions.sort((a, b) => {
                   const currentId = window.localStorage.getItem('raja_permanent_device_id');
                   if (a.id === currentId) return -1;
                   if (b.id === currentId) return 1;
                   return (b.lastSeen || b.createdAt) - (a.lastSeen || a.createdAt);

            let w = img.width; let h = img.height;
            if (w > h && w > MAX) { h *= MAX / w; w = MAX; } 
            else if (h > MAX) { w *= MAX / h; h = MAX; }
            canvas.width = w; canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            
            const lightCartItem = {
                id: art.id,
                title: art.title,
                image: canvas.toDataURL('image/jpeg', 0.85), 
                selectedSize: size,
                price: Number(price),
                priceOriginalOld: oldPrice ? Number(oldPrice) : null,
                cartId: Date.now(),
                qty: 1

                const existingIndex = prev.findIndex(c => c.id === art.id && c.selectedSize === size);
                if (existingIndex >= 0 && (!size || !size.includes('Original'))) {
                    const newCart = [...prev];
                    if ((newCart[existingIndex].qty || 1) < 3) {
                        newCart[existingIndex] = { ...newCart[existingIndex], qty: (newCart[existingIndex].qty || 1) + 1 };
                        setTimeout(() => showToast("☑️ Item quantity updated in Cart!"), 0);

                        return newCart;
                    } else {
                        setTimeout(() => showToast("⚠️ Maximum 3 quantity allowed per item."), 0);
                        return prev;
                    }
                }
                
                const newCart = [lightCartItem, ...prev];
                setTimeout(() => showToast("✅ Artwork added to your Cart!"), 0);

      const LiveCountdown = ({ targetTime, isCorner }) => {
          const [timeLeft, setTimeLeft] = useState(targetTime - Date.now());
          useEffect(() => {
              const interval = setInterval(() => setTimeLeft(targetTime - Date.now()), 1000);
              return () => clearInterval(interval);
          }, [targetTime]);
          
          if (timeLeft <= 0) return <span className="text-gray-500 font-black text-[9px] md:text-[10px] bg-gray-100 px-2 py-1 rounded-md border border-gray-200">Offer Expired</span>;
          
          const d = Math.floor(timeLeft / (1000 * 60 * 60 * 24));
          const h = Math.floor((timeLeft / (1000 * 60 * 60)) % 24);
          const m = Math.floor((timeLeft / 1000 / 60) % 60);
          const s = Math.floor((timeLeft / 1000) % 60);
          
          return (
              <div className={`inline-flex items-center gap-1.5 bg-gradient-to-r from-pink-500 to-purple-600 text-white px-2.5 py-1.5 md:px-3 md:py-2 shadow-sm ${isCorner ? 'rounded-br-xl md:rounded-br-2xl absolute top-0 left-0 z-10' : 'rounded-full'}`}>
                  <svg className="w-3 h-3 md:w-3.5 md:h-3.5 animate-pulse" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                  {/* Ab mobile aur desktop dono mein 'Offer Ends In' dikhega aur compact rahega */}
                  <span className="text-[8px] md:text-[9px] font-black uppercase tracking-widest">Offer Ends In:</span>
                  <span className="text-[9px] md:text-[10px] font-black font-mono bg-black/20 px-1.5 py-0.5 rounded shadow-inner">
                      {d > 0 ? `${d}d ` : ''}{h}h {m}m {s}s
                  </span>
              </div>
          );
      };

        if (checkoutData.country === 'India') {

            isPinValidNow = checkoutData.pin.length === 6 && checkoutData.pinCity && checkoutData.pinCity !== '';
            
            // STRICT MATCH: Agar user manually state/city badalta hai toh match hona chahiye
            if (isPinValidNow && checkoutData.state && checkoutData.city) {

            isLocationMatched = true;

        // 🚨 NAYA: Minimum 15 letters aur kam se kam 2 spaces (3 words) hone chahiye
        const spaceCount = (checkoutData.address.match(/ /g) || []).length;

        const isNameValidNow = checkoutData.name.trim().length >= 3;

        const handleEmailChange = (e) => {
          const val = e.target.value.toLowerCase().replace(/\s+/g, '');
          setCheckoutData(prev => ({...prev, email: val}));
        };

        const handlePhoneChange = (e) => {
          let val = e.target.value;
          if (val.length === 1 && /[1-9]/.test(val)) val = '+' + val;
          val = val.replace(/[^\d+\s-]/g, '');
          if (val.lastIndexOf('+') > 0) {
             val = val.substring(0, val.lastIndexOf('+')) + val.substring(val.lastIndexOf('+')).replace(/\+/g, '');
          }
          setCheckoutData(prev => ({...prev, phone: val}));
        };

        const handlePinChange = async (e) => {
          const val = e.target.value.replace(/[^0-9A-Za-z\s-]/g, '');
          setCheckoutData(prev => ({...prev, pin: val, pinCity: '', pinState: ''})); 
          setLocalAreas([]); // NAYA: Naya PIN type karte hi purani list hata dega
          
          // --- INDIA API LOGIC (WITH ULTIMATE SMART MATCH) ---
          if (checkoutData.country === 'India' && val.length === 6 && /^\d+$/.test(val)) {
              setIsValidating(true);
              try {
                const res = await fetch(`https://api.postalpincode.in/pincode/${val}`);
                const data = await res.json();
                if (data && data[0] && data[0].Status === "Success") {
                  const postOffices = data[0].PostOffice; 
                  const details = postOffices[0];
                  let fetchedState = details.State;
                  let fetchedCity = details.District;
                  
                  const clean = s => s.toLowerCase().replace(/[^a-z]/g, '');

                  // 1. SMART MATCHING FOR STATE
                  let allStates = Object.keys(staticLocationData["India"]);
                  let smartState = fetchedState;
                  let targetState = clean(fetchedState);
                  let maxStateSim = 0;

                  for (let state of allStates) {
                      const current = clean(state);
                      if (current === targetState) { smartState = state; maxStateSim = 1; break; }
                      
                      let matchCount = 0; let searchTarget = targetState;
                      for (let char of current) {
                          if (searchTarget.includes(char)) { matchCount++; searchTarget = searchTarget.replace(char, ''); }
                      }
                      let sim = matchCount / Math.max(current.length, targetState.length);
                      if (sim > maxStateSim) { maxStateSim = sim; smartState = state; }
                  }
                  if (maxStateSim >= 0.65) {
                      fetchedState = smartState;
                  }

                  // 2. SMART MATCHING FOR CITY/DISTRICT
                  let cityList = [...(staticLocationData["India"][fetchedState] || [])]; 
                  let smartCity = fetchedCity;

                  if (cityList.length > 0) {
                      const targetCity = clean(fetchedCity);
                      let maxCitySim = 0;
                      
                      for (let city of cityList) {
                          const current = clean(city);
                          if (current === targetCity) { smartCity = city; maxCitySim = 1; break; }
                          
                          let matchCount = 0; let searchTarget = targetCity;
                          for (let char of current) {
                              if (searchTarget.includes(char)) { matchCount++; searchTarget = searchTarget.replace(char, ''); }

                          let sim = matchCount / Math.max(current.length, targetCity.length);
                          if (sim > maxCitySim) { maxCitySim = sim; smartCity = city; }

                      pinCity: fetchedCity, 
                      pinState: fetchedState,
                      state: fetchedState,
                      city: fetchedCity
                  }));

                 pin: String(checkoutData.pin || '').trim(),
                 city: String(checkoutData.city || ''),
                 state: String(checkoutData.state || ''),

                ctx.fillStyle = '#f3f4f6';

                const ctx = canvas.getContext('2d');
                ctx.imageSmoothingEnabled = true;
                ctx.imageSmoothingQuality = 'high';

                const bgImg = new Image();
                bgImg.onload = () => {
                    const CANVAS_W = 1200; 
                    const CANVAS_H = 1500; 
                    canvas.width = CANVAS_W;
                    canvas.height = CANVAS_H;
                    
                    let sWidth = bgImg.width;
                    let sHeight = bgImg.height;
                    let sX = 0;
                    let sY = 0;

                    const targetRatio = CANVAS_W / CANVAS_H;
                    const imgRatio = sWidth / sHeight;

                    if (imgRatio > targetRatio) {
                        sWidth = sHeight * targetRatio;
                        sX = (bgImg.width - sWidth) / 2;
                    } else {
                        sHeight = sWidth / targetRatio;
                        sY = (bgImg.height - sHeight) / 2;
                    }
                    
                    ctx.drawImage(bgImg, sX, sY, sWidth, sHeight, 0, 0, CANVAS_W, CANVAS_H);
                    
                    const artImg = new Image();
                    artImg.onload = () => {
                        const w = CANVAS_W * (adj.scale / 100);
                        const h = w * (artImg.height / artImg.width);
                        const x = CANVAS_W * (adj.x / 100);
                        const y = CANVAS_H * (adj.y / 100);
                        
                        ctx.save();

                        ctx.drawImage(artImg, -w/2, -h/2, w, h);

             const isDuplicate = announcements.some(a => 
                 a.title === annTitle && 
                 a.message === annMsg

             if (isDuplicate) {

                 return; // Form clear nahi hoga, bas process kill ho jayega
             }

             if (orig) {
                 const isChanged = (annTitle !== orig.title) || (annMsg !== orig.message) || (annShowTimer !== (orig.showTimer || false)) || (annHours !== '0') || (annHours === 'custom' && annCustomDate !== '');

             let updateData = { title: annTitle, message: annMsg, showTimer: annShowTimer };
             if (deleteExpire) {
                 updateData.expireAt = firebase.firestore.FieldValue.delete();
             } else if (finalExpireAt) {
                 updateData.expireAt = finalExpireAt;
             }

             setAnnUploadStatus("Processing...");
             setPendingAnnUpdate(editAnnId);
             annCancelFlag.current = false; // 🚩 Flag down

             setTimeout(() => {
                 if (annCancelFlag.current) return; // 🚨 KILL PROCESS

                let newRotate = artDragStart.origRotate + (angle - artDragStart.startAngle);

      useEffect(() => {

                      db.collection('BlockedHackers').doc(deviceFingerprint).onSnapshot(doc => {
                          if (doc.exists && doc.data().blockedUntil > Date.now() && isMounted) { 
                              setBlockUntil(doc.data().blockedUntil); 
                              setIsAdmin(false); 
                          }
                      });
                  };

                  // 2. IP CHECK (Parallel with 2-second timeout to prevent loading hang)
                  const checkIP = async () => {
                      const dev = await Promise.race([
                          fetchDeviceDetails(),
                          new Promise(resolve => setTimeout(() => resolve(cachedDevInfo || { ip: "Unknown" }), 2000))
                      ]);
                      
                      if (dev && dev.ip && !dev.ip.includes("Unknown")) {
                          const safeIp = dev.ip.replace(/\./g, '_');
                          const ipDoc = await db.collection('BlockedHackers').doc(safeIp).get();
                          if (ipDoc.exists && ipDoc.data().blockedUntil > Date.now() && isMounted) { 
                              setBlockUntil(ipDoc.data().blockedUntil); 
                              setIsAdmin(false); 
                          }
                          db.collection('BlockedHackers').doc(safeIp).onSnapshot(doc => {
                              if (doc.exists && doc.data().blockedUntil > Date.now() && isMounted) { 
                                  setBlockUntil(doc.data().blockedUntil); 
                                  setIsAdmin(false); 
                              }
                          });
                      }
                  };

                  // Dono check ek sath chalayenge (Speed double ho jayegi)
                  await Promise.all([checkHardware(), checkIP()]);
                  
              } catch (e) {
                  console.log("Security Check Error:", e);
              }

              // 3. SAB KUCH VERIFY HONE KE BAAD HI SPINNER HATEGA
              // Agar block hua, toh 'blockUntil' active ho jayega aur seedha Block screen dikhegi.
              if (isMounted) setIsCheckingSecurity(false);
          };
          
          verifyBlockStatus();
          
          return () => { isMounted = false; };
      }, [deviceFingerprint]);


      const registerFail = (type, data) => {
         let lastFailTime = Number(window.localStorage.getItem('raja_last_fail_time') || 0);
         let fails = Number(window.localStorage.getItem('raja_admin_fails') || 0);
         let currentBlock = Number(window.localStorage.getItem('raja_admin_block') || 0);

         if ((currentBlock > 0 && Date.now() > currentBlock) || (lastFailTime > 0 && Date.now() - lastFailTime > 15 * 60 * 1000)) {
             fails = 0;
             window.localStorage.setItem('raja_admin_block', '0');
             window.localStorage.setItem('raja_otp_resends', '0'); 
             setBlockUntil(0);
         }

         fails += 1;
         window.localStorage.setItem('raja_admin_fails', fails);
         window.localStorage.setItem('raja_last_fail_time', Date.now());
         
         if (fails >= 3) {
             const bTime = Date.now() + 15 * 60 * 1000; 
             setBlockUntil(bTime);
             window.localStorage.setItem('raja_admin_block', bTime);
             window.localStorage.setItem('raja_otp_resends', '0');
             
             // 🚀 FIX: SAVING BLOCK TO CLOUD FIREBASE WITH IP (Unbreakable)
             fetchDeviceDetails().then(dev => {
                 const bData = { ip: dev.ip, deviceModel: dev.deviceModel, blockedUntil: bTime, reason: data };
                 if (deviceFingerprint) {
                     db.collection('BlockedHackers').doc(deviceFingerprint).set(bData).catch(e=>{});
                 }
                 if (dev && dev.ip && !dev.ip.includes("Unknown")) {
                     const safeIp = dev.ip.replace(/\./g, '_');
                     db.collection('BlockedHackers').doc(safeIp).set(bData).catch(e=>{});
                 }
                 sendLoginAlert('BLOCKED', 'System Locked for 15 mins (Cloud Block Active)', dev);
             });
             
             setAdminStep(1);
             setPassword('');
             setLiveOTP('');
         } else {
             fetchDeviceDetails().then(dev => sendLoginAlert(type, data, dev));
             if (type === 'FAILED') showToast(`❌ Incorrect Password! Attempt ${fails}/3.`);
         }
      };

        if (!password || password.trim() === '') {
            showToast("⚠️ Please enter your password first!"); 
            return;

        setIsProcessingLogin(true); 

        // 🚨 LEVEL 3 SECURITY: Check Cloud DB BEFORE verifying password
        try {
