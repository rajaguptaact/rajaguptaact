                  {/* Chat Messages Body */}
                  <div className="flex-1 overflow-y-auto bg-gradient-to-b from-purple-50/60 via-white to-pink-50/40">
                      <div className="max-w-4xl mx-auto p-4 md:p-6 space-y-3.5 md:space-y-5">
                          {chatMessages.map((msg, idx) => {
                              const isLatestBotMsg = msg.sender === 'bot' && idx === chatMessages.length - 1 && !isBotTyping;
                              return (
                                  <div key={msg.id} className="space-y-2 md:space-y-2.5">
                                      <div className={`flex items-end gap-2 md:gap-3 ${msg.sender === 'user' ? 'justify-end' : 'justify-start'}`}>
                                          {msg.sender === 'bot' && (
                                              <div className="w-7 h-7 md:w-9 md:h-9 rounded-full bg-purple-100 border border-purple-200 flex items-center justify-center text-xs md:text-base shrink-0 mb-0.5">
                                                  🤖
                                              </div>
                                          )}
                                          <div className={`max-w-[85%] md:max-w-[75%] rounded-2xl px-3.5 md:px-5 py-2.5 md:py-3.5 shadow-sm text-xs md:text-base leading-relaxed ${
                                              msg.sender === 'user'
                                                  ? 'bg-gradient-to-r from-purple-600 to-pink-600 text-white rounded-br-sm font-semibold'
                                                  : 'bg-white text-gray-800 border border-purple-100 rounded-bl-sm font-medium'
                                          }`}>
                                              <p className="whitespace-pre-line">{msg.text}</p>

                                              {/* Direct Page Action Buttons */}
                                              {msg.sender === 'bot' && Array.isArray(msg.actions) && msg.actions.length > 0 && (
                                                  <div className="mt-2.5 md:mt-3 flex flex-wrap gap-1.5 md:gap-2">
                                                      {msg.actions.map((act, aIdx) => (
                                                          <button
                                                              key={aIdx}
                                                              type="button"
                                                              onClick={() => handleChatAction(act.view)}
                                                              className="bg-purple-600 hover:bg-purple-700 text-white font-black text-[11px] md:text-sm py-1.5 md:py-2 px-3 md:px-4 rounded-xl shadow-sm transition active:scale-95 cursor-pointer"
                                                          >
                                                              {act.label} →
                                                          </button>
                                                      ))}
                                                  </div>
                                              )}

                                              {/* Direct WhatsApp Button */}
                                              {msg.showWhatsApp && (
                                                  <a
                                                      href={getStudioWaUrl(msg.waText || "Hi Raja! I came from Website Chat Support and need some help.")}
                                                      target="_blank"
                                                      rel="noopener noreferrer"
                                                      className="mt-2.5 md:mt-3 inline-flex items-center justify-center gap-1.5 w-full bg-emerald-500 hover:bg-emerald-600 text-white font-black text-xs md:text-sm py-2.5 md:py-3 px-3 rounded-xl shadow transition active:scale-95"
                                                  >
                                                      Chat with Raja on WhatsApp
                                                  </a>
                                              )}

                                              <span className={`block text-[10px] md:text-xs mt-1.5 ${msg.sender === 'user' ? 'text-purple-100 text-right' : 'text-gray-400 text-left'}`}>
                                                  {msg.time}
                                              </span>

                                              {/* 👍 Helpful / 👎 Need More Help Feedback */}
                                              {msg.sender === 'bot' && !msg.noFeedback && (
                                                  <div className="mt-2 md:mt-2.5 pt-2 md:pt-2.5 border-t border-gray-100 flex items-center gap-2">
                                                      {msg.feedback === 'up' ? (
                                                          <span className="text-[11px] md:text-xs font-bold text-emerald-600">✓ Thanks for your feedback!</span>
                                                      ) : msg.feedback === 'down' ? (
                                                          <span className="text-[11px] md:text-xs font-bold text-gray-400">Connecting you to personal help...</span>
                                                      ) : (
                                                          <>
                                                              <button
                                                                  type="button"
                                                                  disabled={isBotTyping}
                                                                  onClick={() => handleChatFeedback(msg.id, 'up')}
                                                                  className="text-[11px] md:text-xs font-bold text-gray-500 hover:text-emerald-600 bg-gray-50 hover:bg-emerald-50 border border-gray-200 hover:border-emerald-200 px-2.5 md:px-3.5 py-1 md:py-1.5 rounded-lg transition active:scale-95 cursor-pointer disabled:opacity-50"
                                                              >
                                                                  👍 Helpful
                                                              </button>
                                                              <button
                                                                  type="button"
                                                                  disabled={isBotTyping}
                                                                  onClick={() => handleChatFeedback(msg.id, 'down')}
                                                                  className="text-[11px] md:text-xs font-bold text-gray-500 hover:text-rose-600 bg-gray-50 hover:bg-rose-50 border border-gray-200 hover:border-rose-200 px-2.5 md:px-3.5 py-1 md:py-1.5 rounded-lg transition active:scale-95 cursor-pointer disabled:opacity-50"
                                                              >
                                                                  👎 Need More Help
                                                              </button>
                                                          </>
                                                      )}
                                                  </div>
                                              )}
                                          </div>
                                      </div>

                                      {/* Smart Follow-Up Suggestion Chips (Under Latest Bot Reply) */}
                                      {isLatestBotMsg && Array.isArray(msg.followUps) && msg.followUps.length > 0 && (
                                          <div className="pl-9 md:pl-12 flex flex-wrap gap-1.5 md:gap-2">
                                              {msg.followUps.map((fId) => {
                                                  const topic = getChatTopic(fId);
                                                  if (!topic) return null;
                                                  return (
                                                      <button
                                                          key={fId}
                                                          type="button"
                                                          onClick={() => handleChatTopicTap(topic)}
                                                          className="bg-white hover:bg-purple-50 text-purple-700 border border-purple-200 px-2.5 md:px-3.5 py-1 md:py-1.5 rounded-full text-[11px] md:text-xs font-bold shadow-sm transition active:scale-95 cursor-pointer"
                                                      >
                                                          {topic.label}
                                                      </button>
                                                  );
                                              })}
                                          </div>
                                      )}
                                  </div>
                              );
                          })}

                          {isBotTyping && (
                              <div className="flex items-end gap-2 md:gap-3 justify-start">
                                  <div className="w-7 h-7 md:w-9 md:h-9 rounded-full bg-purple-100 border border-purple-200 flex items-center justify-center text-xs md:text-base shrink-0">
                                      🤖
                                  </div>
                                  <div className="bg-white border border-purple-100 rounded-2xl rounded-bl-sm px-4 py-3 shadow-sm flex items-center gap-1.5">
                                      <span className="w-2 h-2 md:w-2.5 md:h-2.5 bg-purple-500 rounded-full animate-bounce" style={{ animationDelay: '0ms' }}></span>
                                      <span className="w-2 h-2 md:w-2.5 md:h-2.5 bg-fuchsia-500 rounded-full animate-bounce" style={{ animationDelay: '150ms' }}></span>
                                      <span className="w-2 h-2 md:w-2.5 md:h-2.5 bg-pink-500 rounded-full animate-bounce" style={{ animationDelay: '300ms' }}></span>
                                  </div>
                              </div>
                          )}
                          <div ref={chatEndRef}></div>
                      </div>
                  </div>

                  {/* Quick Question Buttons Strip */}
                  <div className="px-3.5 md:px-6 pt-2.5 md:pt-3 pb-1.5 md:pb-2 bg-white border-t border-gray-100 shrink-0">
                      <div className="max-w-4xl mx-auto">
                          <p className="text-[10px] md:text-xs font-extrabold text-gray-400 uppercase tracking-wider mb-1.5 md:mb-2">Quick Questions</p>
                          <div className="flex gap-1.5 md:gap-2 overflow-x-auto pb-1">
                              {CHAT_QUICK_TOPICS.map((topic) => (
                                  <button
                                      key={topic.id}
                                      type="button"
                                      disabled={isBotTyping}
                                      onClick={() => handleChatTopicTap(topic)}
                                      className="shrink-0 bg-purple-50 hover:bg-purple-100 text-purple-700 border border-purple-200 px-3 md:px-4 py-1.5 md:py-2 rounded-full text-[11px] md:text-sm font-bold transition active:scale-95 cursor-pointer disabled:opacity-50"
                                  >
                                      {topic.label}
                                  </button>
                              ))}
                          </div>
                      </div>
                  </div>

                  {/* Bottom Message Input Bar */}
                  <form
                      onSubmit={(e) => { e.preventDefault(); sendChatMessage(chatInput); }}
                      className="p-3 md:p-4 bg-white border-t border-gray-100 shrink-0"
                  >
                      <div className="max-w-4xl mx-auto flex items-center gap-2 md:gap-3">
                          <input
                              type="text"
                              value={chatInput}
                              onChange={(e) => setChatInput(e.target.value)}
                              placeholder="Type your question or Order ID..."
                              className="flex-1 bg-gray-100 focus:bg-white border-2 border-transparent focus:border-purple-400 rounded-full px-4 md:px-5 py-2.5 md:py-3.5 text-xs md:text-base font-medium outline-none transition"
                          />
                          <button
                              type="submit"
                              disabled={!chatInput.trim() || isBotTyping}
                              className="bg-gradient-to-r from-purple-600 to-pink-600 text-white px-4 md:px-7 py-2.5 md:py-3.5 rounded-full font-black text-xs md:text-base shadow-md active:scale-95 transition cursor-pointer disabled:opacity-40"
                          >
                              Send ➤
                          </button>
                      </div>
                  </form>
              </div>
          )}




          {/* ⏳ CENTER ORDER PROCESSING / STATUS POPUP */}
          {orderModal && (
              <div className="fixed inset-0 bg-black/65 z-[99999] flex items-center justify-center p-4 backdrop-blur-sm">
                  <div className={`bg-white rounded-3xl p-6 md:p-8 w-full max-w-xs md:max-w-sm shadow-2xl text-center border-t-4 ${
                      orderModal.type === 'loading' ? 'border-purple-600' :
                      orderModal.type === 'success' ? 'border-green-500' : 'border-red-500'
                  }`}>
                      <div className={`w-14 h-14 md:w-16 md:h-16 rounded-full flex items-center justify-center mx-auto mb-3 md:mb-4 text-2xl md:text-3xl ${
                          orderModal.type === 'loading' ? 'bg-purple-100' :
                          orderModal.type === 'success' ? 'bg-green-100' : 'bg-red-100'
                      }`}>
                          {orderModal.type === 'loading' ? (
                              <svg className="animate-spin h-7 w-7 md:h-8 md:w-8 text-purple-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                  <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle>
                                  <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                              </svg>
                          ) : orderModal.type === 'success' ? '✅' : '❌'}
                      </div>
                      <h3 className="font-black text-lg md:text-xl text-gray-900 mb-1.5">{orderModal.title}</h3>
                      <p className="text-xs md:text-sm font-bold text-gray-500 leading-relaxed">{orderModal.msg}</p>
                      {orderModal.type === 'error' && (
                          <button
                              type="button"
                              onClick={() => setOrderModal(null)}
                              className="mt-5 w-full bg-gradient-to-r from-purple-600 to-pink-600 text-white py-2.5 md:py-3 rounded-xl font-black text-xs md:text-sm shadow-md active:scale-95 transition cursor-pointer"
                          >
                              Try Again
                          </button>
                      )}
                  </div>
              </div>
          )}


          {/* 🔐 LOGOUT CONFIRMATION POPUP */}
          {showLogoutConfirm && (
              <div className="fixed inset-0 bg-black/60 z-[99999] flex items-center justify-center p-4 backdrop-blur-sm" onClick={() => setShowLogoutConfirm(false)}>
                  <div className="bg-white rounded-2xl md:rounded-3xl p-5 md:p-8 w-full max-w-sm shadow-2xl relative border-t-4 border-rose-500 text-center" onClick={e => e.stopPropagation()}>
                      <div className="w-12 h-12 md:w-14 md:h-14 rounded-full bg-rose-100 flex items-center justify-center mx-auto mb-3 md:mb-4">
                          <span className="text-2xl">🔓</span>
                      </div>
                      <h3 className="font-black text-lg md:text-xl text-gray-900 mb-2">Confirm Logout</h3>
                      <p className="text-xs md:text-sm font-bold text-gray-500 mb-5 md:mb-6 leading-relaxed">
                          Are you sure you want to log out? Your Cart, Wishlist & Orders are safely saved in your Gmail account.
                      </p>
                      <div className="flex gap-3">
                          <button type="button" onClick={() => setShowLogoutConfirm(false)} className="flex-1 bg-gray-100 text-gray-700 py-2.5 md:py-3 rounded-xl font-black text-xs md:text-sm hover:bg-gray-200 transition active:scale-95 cursor-pointer">
                              Cancel
                          </button>
                          <button type="button" onClick={() => {
                              setShowLogoutConfirm(false);
                              setMenuOpen(false);
                              isLoggingOutRef.current = true;
                              setIsDataLoaded(false);

                              // Agar Admin Panel open tha toh signOut se pehle offline mark karein
                              if (isAdmin) {
                                  const devId = window.localStorage.getItem('raja_device_id');
                                  if (devId) {
                                      db.collection('adminSessions').doc(devId).update({ lastSeen: Date.now(), isOnline: false }).catch(()=>{});
                                      db.collection('trustedDevices').doc(devId).update({ lastSeen: Date.now(), isOnline: false }).catch(()=>{});
                                  }
                              }

                              // 1. Local Storage & Sync Timestamps Clean
                              try {
                                  window.localStorage.removeItem('raja_cart_live_v1');
                                  window.localStorage.removeItem('raja_my_orders_v1');
                                  window.localStorage.removeItem('raja_wishlist_live_v1');
                                  window.localStorage.removeItem('raja_likes_live_v1');
                                  window.localStorage.removeItem('art_guest_id');
                                  window.localStorage.removeItem('raja_is_guest_session');
                              } catch(e) {}
                              lastCartWriteRef.current = 0;
                              lastSavesWriteRef.current = 0;
                              window.rajaLastOrdersWrite = 0;

                              // 2. Cart, Wishlist, Likes & Orders Reset
                              setCart([]);
                              setWishlist([]);
                              setWishlistPopupArt(null);
                              setUserLikes([]);
                              setMyLocalOrders([]);
                              setRecoveredOrders([]);
                              setHasSearched(false);
                              setSearchWaInput('');
                              setIsRecoverOpen(false);

                              // 3. Admin Panel Full Reset (Device trust safe rahega)
                              setIsAdmin(false);
                              setAdminStep(1);
                              setPassword('');
                              setShowAdminPass(false);
                              setOtpInput('');
                              setLiveOTP('');
                              setOtpTimeLeft(0);
                              setResendTimer(0);
                              setIsProcessingLogin(false);
                              setOrders([]);
                              setActiveSessions([]);
                              setIsDevicesOpen(false);
                              setIsOrdersOpen(false);
                              setIsBgManagerOpen(false);
                              setEditArtId(null);
                              setEditAnnId(null);
                              setUploadData({ title: '', desc: '', image: '', priceOriginal: '', priceOriginalOld: '', priceA3: '', priceA4: '', priceA5: '', isSold: false, customMockups: [] });
                              setAnnTitle(''); setAnnMsg(''); setAnnHours('0'); setAnnShowTimer(false); setAnnCustomDate('');
                              setSelectedBgs([]); setBgAdjustments({}); setPreviewMockups([]); setRawBgFile(null); setIsMediaModified(false);

                              // 4. Checkout, Commission & Payment Reset
                              setCommissionInput({ subject: '', size: '', budget: '', instagram: '' });
                              setCheckoutData({ name: '', email: '', phone: '', address: '', pin: '', city: '', state: '', country: currency === 'USD' ? 'International' : 'India', type: '', itemDetails: null, amount: 0, instagram: '' });
                              setStaticStates([]); setStaticCities([]); setLocalAreas([]);
                              setIsValidating(false);
                              setIsOrderPlaced(false);
                              setLastOrderId(null);
                              setOrderModal(null);
                              if (chatTimerRef.current) clearTimeout(chatTimerRef.current);
                              setIsChatOpen(false);
                              setIsBotTyping(false);
                              setChatInput('');
                              setChatMessages([]);
                              try { window.sessionStorage.removeItem('raja_chat_session_v1'); } catch(e) {}

                              setPremiumAlert(null);


                              // Agar Checkout/Payment beech mein tha toh safe Gallery dikhayein, baaki har page wahin rahega (NO reload)
                              if (view === 'checkout_form' || view === 'payment') {
                                  setView('gallery');
                              }

                              firebase.auth().signOut().then(() => {
                                  showToast("✅ Logged out successfully");
                              }).catch(() => {
                                  isLoggingOutRef.current = false;
                                  setIsDataLoaded(true);
                              });
                          }} className="flex-1 bg-rose-600 text-white py-2.5 md:py-3 rounded-xl font-black text-xs md:text-sm shadow-md hover:bg-rose-700 transition active:scale-95 cursor-pointer">
                              Yes, Logout
                          </button>
                      </div>
                  </div>
              </div>
          )}

          
            {/* 🚀 WISHLIST SIZE POPUP */}
            {wishlistPopupArt && (
                <div className="fixed inset-0 bg-black/60 z-[9999] flex items-center justify-center p-4 backdrop-blur-sm" onClick={() => setWishlistPopupArt(null)}>
                    <div className="bg-white rounded-3xl p-5 md:p-6 w-full max-w-sm shadow-2xl relative" onClick={e => e.stopPropagation()}>
                        <button onClick={() => setWishlistPopupArt(null)} className="absolute top-4 right-4 text-gray-400 hover:text-gray-800 font-black text-xl cursor-pointer">✕</button>
                        
                        <h3 className="font-black text-lg md:text-xl text-gray-900 mb-4 pr-6">Select Size to Save</h3>
                        
                        <div className="space-y-3">
                            {['Original A4 Colour Pencil', 'Print A3', 'Print A4', 'Print A5'].map(size => {
                                let hasSize = false;
                                if (size === 'Original A4 Colour Pencil' && wishlistPopupArt.priceOriginal) hasSize = true;
                                if (size === 'Print A3' && wishlistPopupArt.priceA3) hasSize = true;
                                if (size === 'Print A4' && wishlistPopupArt.priceA4) hasSize = true;
                                if (size === 'Print A5' && wishlistPopupArt.priceA5) hasSize = true;
                                
                                if (!hasSize) return null;
                                
                                // Purane saves ko bhi naye system ke sath correctly match karne ka logic
                                const isSaved = wishlist.some(w => {
                                    if (w.id !== wishlistPopupArt.id) return false;
                                    const wSize = w.savedSize || 'Original Artwork';
                                    if (size === 'Original A4 Colour Pencil' && (wSize === 'Original Artwork' || wSize === 'Original A4 Colour Pencil')) return true;
                                    if (size === 'Print A3' && (wSize === 'A3' || wSize === 'Print A3')) return true;
                                    if (size === 'Print A4' && (wSize === 'A4' || wSize === 'Print A4')) return true;
                                    if (size === 'Print A5' && (wSize === 'A5' || wSize === 'Print A5')) return true;
                                    return false;
                                });
                                
                                return (
                                    <div key={size} onClick={() => { 
                                        toggleWishlist(wishlistPopupArt, size); 
                                        setWishlistPopupArt(null); 
                                    }} className={`flex items-center justify-between p-3 rounded-xl border-2 cursor-pointer transition active:scale-95 ${isSaved ? 'border-purple-500 bg-purple-50' : 'border-gray-100 hover:border-purple-200 bg-gray-50'}`}>
                                        <span className={`font-black text-sm md:text-base ${isSaved ? 'text-purple-700' : 'text-gray-700'}`}>{size}</span>
                                        {isSaved ? (
                                            <span className="text-[10px] md:text-xs font-black text-purple-600 bg-purple-200 px-2 py-1 rounded-md">SAVED</span>
                                        ) : (
                                            <span className="text-[10px] md:text-xs font-black text-gray-400">+ Save</span>
                                        )}
                                    </div>
                                );
                            })}
                        </div>
                    </div>
                </div>
            )}

        </div>
      );
    }
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
  </html>
