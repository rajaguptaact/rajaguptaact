<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Raja Gupta Act</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-indigo-50 via-purple-50 to-pink-50 flex flex-col items-center justify-center min-h-screen p-6">
  
  <div class="bg-white p-8 rounded-3xl shadow-xl border border-gray-100 w-full max-w-sm relative">
     <h1 class="text-2xl font-black mb-2 text-center text-gray-900">Welcome</h1>
     <p class="text-xs text-gray-500 mb-6 text-center font-bold">Login or Create an account</p>

     <div class="space-y-4 mb-6">
        <div>
           <label class="text-[10px] font-black text-gray-500 uppercase tracking-widest">Email Address</label>
           <input type="email" id="emailInput" class="w-full border-2 border-gray-200 p-3 rounded-xl focus:border-purple-500 outline-none font-medium text-sm text-gray-800" placeholder="name@example.com">
        </div>
        <div>
           <label class="text-[10px] font-black text-gray-500 uppercase tracking-widest">Password</label>
           <input type="password" id="passInput" class="w-full border-2 border-gray-200 p-3 rounded-xl focus:border-purple-500 outline-none font-medium text-sm text-gray-800" placeholder="Min 6 characters">
        </div>
        
        <div class="flex gap-3 pt-2">
           <button id="emailLoginBtn" class="flex-1 bg-purple-600 text-white py-3 rounded-xl font-black text-sm hover:bg-purple-700 shadow-md transition active:scale-95">Login</button>
           <button id="emailSignupBtn" class="flex-1 bg-white border-2 border-purple-600 text-purple-600 py-3 rounded-xl font-black text-sm hover:bg-purple-50 transition active:scale-95">Sign Up</button>
        </div>
     </div>

     <div class="flex items-center gap-3 mb-6">
        <div class="flex-1 h-px bg-gray-200"></div>
        <span class="text-[10px] font-black text-gray-400 uppercase tracking-widest">OR</span>
        <div class="flex-1 h-px bg-gray-200"></div>
     </div>

     <button id="googleLoginBtn" class="w-full py-3.5 bg-white border-2 border-gray-200 rounded-xl shadow-sm flex items-center justify-center gap-3 hover:bg-gray-50 transition-all font-black text-gray-700 text-sm mb-6 active:scale-95">
        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google" class="w-5 h-5">
        <span id="googleBtnText">Continue with Google</span>
     </button>

     <!-- 🚀 LINKING DIRECTLY TO YOUR T&C AND PRIVACY VIEWS -->
     <div class="flex items-start gap-3 bg-gray-50 p-3.5 rounded-xl border border-gray-100">
        <input type="checkbox" id="termsCheck" class="w-5 h-5 mt-0.5 accent-purple-600 cursor-pointer">
        <span class="text-[10px] text-gray-500 font-bold leading-relaxed">
           I agree to the <a href="index.html?open=terms" class="text-purple-600 underline hover:text-purple-800 cursor-pointer">Terms of Service</a> & <a href="index.html?open=privacy" class="text-purple-600 underline hover:text-purple-800 cursor-pointer">Privacy Policy</a>.
        </span>
     </div>
     
     <p id="errorText" class="text-xs text-red-600 bg-red-50 border border-red-200 p-2 rounded-lg font-bold mt-4 text-center hidden"></p>
  </div>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    // YAHAN HUMNE 'signInWithRedirect' AUR 'onAuthStateChanged' ADD KIYA HAI
    import { getAuth, signInWithRedirect, GoogleAuthProvider, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBCX9rALYZSxzYvawPexwXIHTSA3uhU24E",
      authDomain: "rajaguptaact.firebaseapp.com",
      projectId: "rajaguptaact",
      storageBucket: "rajaguptaact.firebasestorage.app",
      messagingSenderId: "9946165167",
      appId: "1:9946165167:web:5809fb442b06882980495a"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    const termsCheck = document.getElementById('termsCheck');
    const errorText = document.getElementById('errorText');
    const emailInput = document.getElementById('emailInput');
    const passInput = document.getElementById('passInput');

    // 🚀 REDIRECT GLITCH FIX: Agar pehle se login hai, toh turant wapas bhej do
    onAuthStateChanged(auth, (user) => {
        if (user) {
            window.location.replace("index.html"); 
        }
    });

    function showError(msg) {
       errorText.innerText = "❌ " + msg;
       errorText.classList.remove('hidden');
    }

    function checkTerms() {
       if (!termsCheck.checked) {
           showError("Please tick the checkbox to accept Terms & Privacy.");
           return false;
       }
       errorText.classList.add('hidden');
       return true;
    }

    // 🚀 GOOGLE MOBILE FULL-SCREEN FIX
    document.getElementById('googleLoginBtn').addEventListener('click', () => {
        if (!checkTerms()) return;
        const btnText = document.getElementById('googleBtnText');
        btnText.innerText = "Connecting to Google...";
        // Popup ki jagah Redirect use kiya hai taaki mobile par full screen khule aur fass na jaye
        signInWithRedirect(auth, provider);
    });

    // 🚀 SMART ERROR LOGIC FIX
    document.getElementById('emailLoginBtn').addEventListener('click', async () => {
        if (!checkTerms()) return;
        const email = emailInput.value.trim();
        const pass = passInput.value.trim();
        
        // Naya Smart Logic: Jo khali hai sirf wahi mangega
        if(!email && !pass) { showError("Please enter your Email and Password."); return; }
        if(!email) { showError("Please enter your Email Address."); return; }
        if(!pass) { showError("Please enter your Password."); return; }
        
        const btn = document.getElementById('emailLoginBtn');
        btn.innerText = "Wait...";
        try {
            await signInWithEmailAndPassword(auth, email, pass);
            // Login hote hi upar wala onAuthStateChanged apne aap redirect kar dega
        } catch (error) {
            showError("Invalid Email or Password. Try again.");
            btn.innerText = "Login";
        }
    });

    document.getElementById('emailSignupBtn').addEventListener('click', async () => {
        if (!checkTerms()) return;
        const email = emailInput.value.trim();
        const pass = passInput.value.trim();
        
        if(!email && !pass) { showError("Please enter Email and Password to Sign Up."); return; }
        if(!email) { showError("Please enter your Email Address."); return; }
        if(!pass) { showError("Please enter a Password (Min 6 chars)."); return; }
        if(pass.length < 6) { showError("Password must be at least 6 characters."); return; }
        
        const btn = document.getElementById('emailSignupBtn');
        btn.innerText = "Wait...";
        try {
            await createUserWithEmailAndPassword(auth, email, pass);
        } catch (error) {
            if(error.code === 'auth/email-already-in-use') showError("Email already registered. Click 'Login' instead.");
            else showError(error.message);
            btn.innerText = "Sign Up";
        }
    });
  </script>
  
</body>
</html>
