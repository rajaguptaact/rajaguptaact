<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Raja Gupta Act</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-indigo-50 via-purple-50 to-pink-50 flex flex-col items-center justify-center min-h-screen p-6">
  
  <div class="bg-white p-8 rounded-3xl shadow-xl border border-gray-100 w-full max-w-sm relative">
     <h1 class="text-2xl font-black mb-2 text-center text-gray-900">Welcome</h1>
     <p class="text-xs text-gray-500 mb-6 text-center font-bold">Login or Create an account</p>

     <!-- 🚀 AUTOFILL FIX: Form tag aur autocomplete add kiya gaya hai -->
     <form id="authForm" class="space-y-4 mb-6">
        <div>
           <label class="text-[10px] font-black text-gray-500 uppercase tracking-widest">Email Address</label>
           <input 
              type="email" 
              id="emailInput" 
              name="email" 
              autocomplete="username" 
              class="w-full border-2 border-gray-200 p-3 rounded-xl focus:border-purple-500 outline-none font-medium text-sm text-gray-800" 
              placeholder="name@example.com" 
              required
           >
        </div>
        <div>
           <label class="text-[10px] font-black text-gray-500 uppercase tracking-widest">Password</label>
           <input 
              type="password" 
              id="passInput" 
              name="password" 
              autocomplete="current-password" 
              class="w-full border-2 border-gray-200 p-3 rounded-xl focus:border-purple-500 outline-none font-medium text-sm text-gray-800" 
              placeholder="Min 6 characters" 
              required
           >
        </div>
        
        <div class="flex gap-3 pt-2">
           <button 
              type="button" 
              id="emailLoginBtn" 
              class="flex-1 bg-purple-600 text-white py-3 rounded-xl font-black text-sm hover:bg-purple-700 shadow-md transition active:scale-95"
           >
              Login
           </button>
           <button 
              type="button" 
              id="emailSignupBtn" 
              class="flex-1 bg-white border-2 border-purple-600 text-purple-600 py-3 rounded-xl font-black text-sm hover:bg-purple-50 transition active:scale-95"
           >
              Sign Up
           </button>
        </div>
     </form>

     <div class="flex items-center gap-3 mb-6">
        <div class="flex-1 h-px bg-gray-200"></div>
        <span class="text-[10px] font-black text-gray-400 uppercase tracking-widest">OR</span>
        <div class="flex-1 h-px bg-gray-200"></div>
     </div>

     <button 
        type="button" 
        id="googleLoginBtn" 
        class="w-full py-3.5 bg-white border-2 border-gray-200 rounded-xl shadow-sm flex items-center justify-center gap-3 hover:bg-gray-50 transition-all font-black text-gray-700 text-sm mb-6 active:scale-95 cursor-pointer"
     >
        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google" class="w-5 h-5">
        <span id="googleBtnText">Continue with Google</span>
     </button>

     <div class="flex items-start gap-3 bg-gray-50 p-3.5 rounded-xl border border-gray-100">
        <input type="checkbox" id="termsCheck" class="w-5 h-5 mt-0.5 accent-purple-600 cursor-pointer">
        <span class="text-[10px] text-gray-500 font-bold leading-relaxed">
           I agree to the 
           <a href="index.html?open=terms" class="text-purple-600 underline hover:text-purple-800 cursor-pointer">Terms of Service</a> 
           & 
           <a href="index.html?open=privacy" class="text-purple-600 underline hover:text-purple-800 cursor-pointer">Privacy Policy</a>.
        </span>
     </div>
     
     <p id="errorText" class="text-xs text-red-600 bg-red-50 border border-red-200 p-2 rounded-lg font-bold mt-4 text-center hidden"></p>
  </div>

  <!-- LIVE STATUS / SUCCESS / ERROR POPUP MODAL -->
  <div id="statusModal" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm hidden items-center justify-center p-4">
     <div class="bg-white rounded-3xl p-6 w-full max-w-xs shadow-2xl text-center border-t-4 border-purple-600" id="statusCard">
        <div id="statusIcon" class="w-14 h-14 rounded-full bg-purple-100 flex items-center justify-center mx-auto mb-3">
           <svg class="animate-spin h-7 w-7 text-purple-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
           </svg>
        </div>
        <h3 id="statusTitle" class="font-black text-lg text-gray-900 mb-1">Please Wait...</h3>
        <p id="statusMsg" class="text-xs font-bold text-gray-500 leading-relaxed mb-4">Connecting securely...</p>
        <button id="statusCloseBtn" type="button" class="hidden w-full bg-purple-600 text-white py-2.5 rounded-xl font-black text-sm shadow-md hover:bg-purple-700 active:scale-95 transition">
           Try Again
        </button>
     </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

  <script>
    const GOOGLE_CLIENT_ID = "9946165167-rnq7dirshmi8thut5dueo92hmulsv1pr.apps.googleusercontent.com";

    const firebaseConfig = {
      apiKey: "AIzaSyBCX9rALYZSxzYvawPexwXIHTSA3uhU24E",
      authDomain: "rajaguptaact.firebaseapp.com",
      projectId: "rajaguptaact",
      storageBucket: "rajaguptaact.firebasestorage.app",
      messagingSenderId: "9946165167",
      appId: "1:9946165167:web:5809fb442b06882980495a"
    };

    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const auth = firebase.auth();
    auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(() => {});

    const termsCheck = document.getElementById('termsCheck');
    const errorText = document.getElementById('errorText');
    const emailInput = document.getElementById('emailInput');
    const passInput = document.getElementById('passInput');
    const googleTermsGuard = document.getElementById('googleTermsGuard');
    const googleSignInDiv = document.getElementById('googleSignInDiv');
    const googleBtnWrapper = document.getElementById('googleBtnWrapper');

    const statusModal = document.getElementById('statusModal');
    const statusCard = document.getElementById('statusCard');
    const statusIcon = document.getElementById('statusIcon');
    const statusTitle = document.getElementById('statusTitle');
    const statusMsg = document.getElementById('statusMsg');
    const statusCloseBtn = document.getElementById('statusCloseBtn');

    let hasRedirected = false;

    function showStatus(type, title, msg) {
        statusTitle.innerText = title;
        statusMsg.innerText = msg;
        statusModal.classList.remove('hidden');
        statusModal.classList.add('flex');

        if (type === 'loading') {
            statusCard.className = "bg-white rounded-3xl p-6 w-full max-w-xs shadow-2xl text-center border-t-4 border-purple-600";
            statusIcon.className = "w-14 h-14 rounded-full bg-purple-100 flex items-center justify-center mx-auto mb-3";
            statusIcon.innerHTML = `<svg class="animate-spin h-7 w-7 text-purple-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>`;
            statusCloseBtn.classList.add('hidden');
        } else if (type === 'success') {
            statusCard.className = "bg-white rounded-3xl p-6 w-full max-w-xs shadow-2xl text-center border-t-4 border-green-500";
            statusIcon.className = "w-14 h-14 rounded-full bg-green-100 flex items-center justify-center mx-auto mb-3 text-2xl";
            statusIcon.innerText = "✅";
            statusCloseBtn.classList.add('hidden');
        } else {
            statusCard.className = "bg-white rounded-3xl p-6 w-full max-w-xs shadow-2xl text-center border-t-4 border-red-500";
            statusIcon.className = "w-14 h-14 rounded-full bg-red-100 flex items-center justify-center mx-auto mb-3 text-2xl";
            statusIcon.innerText = "❌";
            statusCloseBtn.classList.remove('hidden');
        }
    }

    function hideStatus() {
        statusModal.classList.add('hidden');
        statusModal.classList.remove('flex');
    }

    statusCloseBtn.addEventListener('click', hideStatus);

    function showError(msg) {
       errorText.innerText = "❌ " + msg;
       errorText.classList.remove('hidden');
       errorText.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    function checkTerms() {
       if (!termsCheck.checked) {
           showError("Please tick the checkbox to accept Terms & Privacy.");
           return false;
       }
       errorText.classList.add('hidden');
       return true;
    }

    function withTimeout(promise, ms = 15000) {
        return Promise.race([
            promise,
            new Promise((_, reject) => setTimeout(() => reject({ code: 'custom/timeout' }), ms))
        ]);
    }

    function getFriendlyError(error) {
        if (!navigator.onLine) return "No internet connection. Please turn on mobile data or Wi-Fi and try again.";
        if (error && error.code === 'custom/timeout') return "Network is too slow or connection timed out. Please try again.";
        if (error && error.code === 'auth/network-request-failed') return "Network error. Please check your internet connection and try again.";
        if (error && error.code === 'auth/email-already-in-use') return "This email is already registered. Please tap 'Login' instead.";
        if (error && (error.code === 'auth/wrong-password' || error.code === 'auth/user-not-found' || error.code === 'auth/invalid-credential')) return "Incorrect Email or Password. Please check and try again.";
        return (error && error.message) ? error.message : "Login failed. Please try again.";
    }

    // Unlock real Google button only when Terms checkbox is ticked
    function updateTermsGuard() {
        if (termsCheck.checked) {
            googleTermsGuard.classList.add('hidden');
            errorText.classList.add('hidden');
        } else {
            googleTermsGuard.classList.remove('hidden');
        }
    }
    termsCheck.addEventListener('change', updateTermsGuard);
    googleTermsGuard.addEventListener('click', () => {
        if (!navigator.onLine) {
            showStatus('error', 'No Internet Connection', 'Please turn on mobile data or Wi-Fi and try again.');
            return;
        }
        checkTerms();
    });

    async function goHome(user) {
        if (hasRedirected) return;
        hasRedirected = true;
        showStatus('success', 'Login Successful!', 'Redirecting to Raja Gupta Act Studio...');
        try {
            if (user) await withTimeout(user.getIdToken(), 8000);
        } catch(e) {}
        setTimeout(() => {
            window.location.replace("index.html");
        }, 600);
    }

    // If user is already logged in, redirect straight to home
    auth.onAuthStateChanged((user) => {
        if (user) {
            goHome(user);
        }
    });

    // OFFICIAL GOOGLE IDENTITY SERVICES CALLBACK (1st-Try Login for Old & New Gmail)
    async function handleGoogleCredential(response) {
        if (!navigator.onLine) {
            showStatus('error', 'No Internet Connection', 'Your internet is disconnected. Please reconnect and try again.');
            return;
        }
        if (!response || !response.credential) {
            showStatus('error', 'Login Failed', 'Google did not return login verification. Please try again.');
            return;
        }

        showStatus('loading', 'Verifying Account...', 'Signing in securely with Google. Please wait...');

        try {
            const credential = firebase.auth.GoogleAuthProvider.credential(response.credential);
            const result = await withTimeout(auth.signInWithCredential(credential), 15000);
            if (result && result.user) {
                goHome(result.user);
            } else {
                showStatus('error', 'Login Failed', 'Unable to verify your Google account. Please try again.');
            }
        } catch (error) {
            showStatus('error', 'Login Failed', getFriendlyError(error));
        }
    }

    function initGoogleSignIn(attempt = 0) {
        if (window.google && window.google.accounts && window.google.accounts.id) {
            try {
                window.google.accounts.id.initialize({
                    client_id: GOOGLE_CLIENT_ID,
                    callback: handleGoogleCredential,
                    auto_select: false,
                    cancel_on_tap_outside: true,
                    itp_support: true
                });
                googleSignInDiv.innerHTML = '';
                const btnW = Math.min(340, Math.max(240, Math.floor(googleBtnWrapper.offsetWidth || 300)));
                window.google.accounts.id.renderButton(googleSignInDiv, {
                    theme: 'outline',
                    size: 'large',
                    shape: 'pill',
                    text: 'continue_with',
                    width: btnW
                });
                updateTermsGuard();
            } catch (e) {
                googleSignInDiv.innerHTML = `<button type="button" onclick="window.location.reload()" class="w-full py-3 bg-red-50 border-2 border-red-200 text-red-600 rounded-xl font-black text-xs cursor-pointer">⚠️ Google Sign-In Error. Tap to Retry</button>`;
            }
        } else if (attempt < 25) {
            setTimeout(() => initGoogleSignIn(attempt + 1), 250);
        } else {
            googleSignInDiv.innerHTML = `<button type="button" onclick="window.location.reload()" class="w-full py-3 bg-red-50 border-2 border-red-200 text-red-600 rounded-xl font-black text-xs cursor-pointer">⚠️ Slow/No Internet. Tap to Reload Google Sign-In</button>`;
            googleTermsGuard.classList.add('hidden');
        }
    }

    window.addEventListener('load', () => initGoogleSignIn(0));

    // EMAIL LOGIN LOGIC
    document.getElementById('emailLoginBtn').addEventListener('click', async (e) => {
        e.preventDefault();
        if (!checkTerms()) return;
        if (!navigator.onLine) {
            showStatus('error', 'No Internet Connection', 'Please turn on mobile data or Wi-Fi and try again.');
            return;
        }

        const email = emailInput.value.trim();
        const pass = passInput.value.trim();

        if (!email && !pass) { showError("Please enter your Email and Password."); return; }
        if (!email) { showError("Please enter your Email Address."); return; }
        if (!pass) { showError("Please enter your Password."); return; }

        showStatus('loading', 'Signing In...', 'Verifying your email and password...');

        try {
            const res = await withTimeout(auth.signInWithEmailAndPassword(email, pass), 15000);
            goHome(res.user);
        } catch (error) {
            showStatus('error', 'Login Failed', getFriendlyError(error));
        }
    });

    // EMAIL SIGNUP LOGIC
    document.getElementById('emailSignupBtn').addEventListener('click', async (e) => {
        e.preventDefault();
        if (!checkTerms()) return;
        if (!navigator.onLine) {
            showStatus('error', 'No Internet Connection', 'Please turn on mobile data or Wi-Fi and try again.');
            return;
        }

        const email = emailInput.value.trim();
        const pass = passInput.value.trim();

        if (!email && !pass) { showError("Please enter Email and Password to Sign Up."); return; }
        if (!email) { showError("Please enter your Email Address."); return; }
        if (!pass) { showError("Please enter a Password (Min 6 chars)."); return; }
        if (pass.length < 6) { showError("Password must be at least 6 characters."); return; }

        showStatus('loading', 'Creating Account...', 'Setting up your new account...');

        try {
            const res = await withTimeout(auth.createUserWithEmailAndPassword(email, pass), 15000);
            goHome(res.user);
        } catch (error) {
            showStatus('error', 'Sign Up Failed', getFriendlyError(error));
        }
    });
  </script>
</body>
</html>
